# dagster.yaml — Host A (control plane)
#
# This runs on the host with the webserver, daemon, and postgres.

scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

run_launcher:
  module: dagster_multihost_launcher
  class: MultiHostDockerRunLauncher
  config:
    # Env vars passed to ALL Docker run containers
    default_env_vars:
      - DAGSTER_POSTGRES_USER
      - DAGSTER_POSTGRES_PASSWORD
      - DAGSTER_POSTGRES_DB
      - DAGSTER_POSTGRES_HOST
      - DAGSTER_POSTGRES_PORT

    # Central .env file (on this host) injected into ALL run containers.
    # Lowest precedence — a single place for env managed by an external tool
    # such as Komodo, which renders its Variables/Secrets into this file.
    default_env_file: "/etc/dagster/shared.env"

    # Default container kwargs applied to all Docker hosts
    default_container_kwargs:
      auto_remove: false
      # For Loki (loki/docker-host.alloy): log run containers with json-file and
      # embed their dagster/* labels in every line, so Alloy can read a run's
      # logs from disk -- in full, however briefly the container ran -- and
      # still know which run they belong to. Match labels-regex to
      # container_label_prefix if you change it.
      log_config:
        type: json-file
        config:
          labels-regex: "^dagster/"
          max-size: "50m"
          max-file: "3"

    # Docker hosts and their code location mappings
    docker_hosts:
      # Host A (local): containerized code locations on the control plane host.
      # Omitting docker_url connects to the local Docker daemon.
      - host_name: "host-a"
        location_names:
          - "local_pipelines"
        network: "dagster_network"

      # Host B: runs data pipeline code locations
      - host_name: "host-b"
        docker_url: "tcp://10.0.1.2:2376"
        tls:
          ca_cert: "/certs/ca.pem"
          client_cert: "/certs/client-cert.pem"
          client_key: "/certs/client-key.pem"
          verify: true
        location_names:
          - "etl_pipelines"
          - "ml_training"
        env_vars:
          - "WAREHOUSE_HOST=10.0.1.50"
        # Per-host .env file (overrides default_env_file, below env_vars).
        env_file: "/etc/dagster/host-b.env"
        # No 'network' here: run containers join the code-location server's own
        # networks, so they reach whatever it reaches without repeating a
        # Compose-generated network name. Host C below overrides that instead.
        #
        # Likewise, run containers inherit the server's environment. The server
        # is discovered from the run's gRPC origin (by container name, else by
        # published port), so no naming convention is needed. Override with an
        # explicit name if yours matches neither, or "off" to inherit nothing:
        #   inherit_env_from_container: "{location}_code_server"

      # Host C: runs analytics code locations
      - host_name: "host-c"
        docker_url: "tcp://10.0.1.3:2376"
        tls:
          ca_cert: "/certs/ca.pem"
          client_cert: "/certs/client-cert.pem"
          client_key: "/certs/client-key.pem"
          verify: true
        location_names:
          - "analytics"
        # Explicit network: overrides inheritance, e.g. to put runs on a
        # different network than the code-location server itself.
        network: "host_c_dagster_network"

    # Any location NOT listed above (e.g. "admin", "reporting_service")
    # will use the DefaultRunLauncher and run as a subprocess via gRPC.

    # Link each run to its logs in Grafana/Loki (see loki/). Posted as a
    # clickable engine event at launch. Placeholders: {run_id}, {job_name},
    # {location}, {host_name}, {launch_ms}. This one opens Explore on the
    # Loki query {host=~".+"} | dagster_run_id="<run id>" from launch time;
    # replace LOKI_UID with your Loki data source's uid.
    log_url_template: "https://grafana.example.internal/explore?schemaVersion=1&orgId=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22LOKI_UID%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22loki%22%2C%22uid%22%3A%22LOKI_UID%22%7D%2C%22expr%22%3A%22%7Bhost%3D~%5C%22.%2B%5C%22%7D%20%7C%20dagster_run_id%3D%5C%22{run_id}%5C%22%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22{launch_ms}%22%2C%22to%22%3A%22now%22%7D%7D%7D"

storage:
  postgres:
    postgres_db: &postgres_db
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      hostname:
        env: DAGSTER_POSTGRES_HOST
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

# Captured stdout/stderr ("compute logs"). This config travels to every run
# worker in the instance_ref, so it applies to runs on every host -- and every
# run image (and Host D) must have the chosen module installed, or runs fail.
# Without this block, logs land on the disk of whichever host ran the step and
# never reach the webserver on Host A.
compute_logs:
  module: dagster_multihost_launcher.compute_log_manager
  class: PostgresComputeLogManager
  config:
    # Same database as storage above; every run worker already reaches it.
    postgres_db: *postgres_db
    # Upload in-progress logs every 30s, so running steps show output in the
    # UI and a crashed run keeps what it printed.
    upload_interval: 30
    # Per-file cap; longer logs keep only their tail.
    max_log_bytes: 10485760

# Alternative: S3 via dagster-aws (install dagster-aws everywhere, and add
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_DEFAULT_REGION to
# default_env_vars above so run containers get the credentials).
# compute_logs:
#   module: dagster_aws.s3.compute_log_manager
#   class: S3ComputeLogManager
#   config:
#     bucket: "my-dagster-compute-logs"
#     prefix: "dagster"
#     upload_interval: 30
#     # For a self-hosted S3-compatible store (MinIO, Garage, SeaweedFS):
#     # endpoint_url: "http://10.0.1.1:9000"

# Route Python `logging` records into the structured event log (Postgres), so
# they show in the run's event view alongside context.log. List the loggers
# your code and libraries use; this does not capture print() or subprocess
# output -- that is what compute_logs above is for.
python_logs:
  python_log_level: INFO
  managed_python_loggers:
    - my_project
