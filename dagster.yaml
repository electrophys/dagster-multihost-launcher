# dagster.yaml — Host A (control plane)
#
# This runs on the host with the webserver, daemon, and postgres.

scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

run_launcher:
  module: dagster_multihost_launcher
  class: MultiHostDockerRunLauncher
  config:
    # Env vars passed to ALL Docker run containers
    default_env_vars:
      - DAGSTER_POSTGRES_USER
      - DAGSTER_POSTGRES_PASSWORD
      - DAGSTER_POSTGRES_DB
      - DAGSTER_POSTGRES_HOST
      - DAGSTER_POSTGRES_PORT

    # Central .env file (on this host) injected into ALL run containers.
    # Lowest precedence — a single place for env managed by an external tool
    # such as Komodo, which renders its Variables/Secrets into this file.
    default_env_file: "/etc/dagster/shared.env"

    # Default container kwargs applied to all Docker hosts
    default_container_kwargs:
      auto_remove: false

    # Docker hosts and their code location mappings
    docker_hosts:
      # Host A (local): containerized code locations on the control plane host.
      # Omitting docker_url connects to the local Docker daemon.
      - host_name: "host-a"
        location_names:
          - "local_pipelines"
        network: "dagster_network"

      # Host B: runs data pipeline code locations
      - host_name: "host-b"
        docker_url: "tcp://10.0.1.2:2376"
        tls:
          ca_cert: "/certs/ca.pem"
          client_cert: "/certs/client-cert.pem"
          client_key: "/certs/client-key.pem"
          verify: true
        location_names:
          - "etl_pipelines"
          - "ml_training"
        network: "host_b_dagster_network"
        env_vars:
          - "WAREHOUSE_HOST=10.0.1.50"
        # Per-host .env file (overrides default_env_file, below env_vars).
        env_file: "/etc/dagster/host-b.env"
        # Inherit the code-location server's own environment so run containers
        # match it exactly. {location} is filled with the run's code location
        # name (e.g. the "etl_pipelines" server container "code-etl_pipelines").
        inherit_env_from_container: "code-{location}"

      # Host C: runs analytics code locations
      - host_name: "host-c"
        docker_url: "tcp://10.0.1.3:2376"
        tls:
          ca_cert: "/certs/ca.pem"
          client_cert: "/certs/client-cert.pem"
          client_key: "/certs/client-key.pem"
          verify: true
        location_names:
          - "analytics"
        network: "host_c_dagster_network"

    # Any location NOT listed above (e.g. "admin", "reporting_service")
    # will use the DefaultRunLauncher and run as a subprocess via gRPC.

storage:
  postgres:
    postgres_db:
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      hostname:
        env: DAGSTER_POSTGRES_HOST
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432
